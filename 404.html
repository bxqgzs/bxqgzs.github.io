<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - 白小谦工作室</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#fbfbfd">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", system-ui, sans-serif; }
        .no-js .reveal { opacity: 1 !important; transform: none !important; }
    </style>
</head>
<body class="bg-[#fbfbfd] text-[#1d1d1f] min-h-screen flex items-center justify-center px-6 text-center">
    <div class="reveal max-w-lg">
        <p class="text-[#0071e3] font-semibold text-lg mb-4">404</p>
        <h1 class="text-4xl sm:text-5xl font-semibold tracking-tight mb-5">页面未找到</h1>
        <p class="text-lg text-[#6e6e73] mb-10 leading-relaxed">你访问的页面不存在或已被移除。返回首页继续探索白小谦工作室的作品。</p>
        <a href="/" class="inline-flex items-center gap-2 bg-[#0071e3] hover:bg-[#0077ED] text-white text-base font-medium px-6 py-3 rounded-full transition-colors">
            返回首页 <i class="fa fa-arrow-right text-sm"></i>
        </a>
    </div>
    <script>
        document.documentElement.classList.remove('no-js');
        var el = document.querySelector('.reveal');
        if (el) { el.style.transition = 'opacity .6s ease, transform .6s ease'; setTimeout(function(){ el.style.opacity='1'; el.style.transform='none'; }, 100); }
    </script>
    <noscript><style>.reveal{opacity:1!important;transform:none!important;}</style></noscript>
</body>
</html>
